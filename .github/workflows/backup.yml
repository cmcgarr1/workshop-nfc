name: Daily Supabase backup

on:
  schedule:
    - cron: '0 8 * * *'   # 8am UTC daily
  workflow_dispatch: {}    # lets you trigger a backup manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" > backup-$(date +%F).sql

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install awscli --quiet
          aws s3 cp backup-$(date +%F).sql s3://workshop-nfc/ \
            --endpoint-url https://9cd1da39a47c84601320f522e53e124c.r2.cloudflarestorage.com
